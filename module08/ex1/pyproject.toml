[tool.poetry]
name = "matrix-data-analysis"
version = "0.1.0"
description = "A simulated Matrix data analysis pipeline"
authors = ["Data Architect <architect@zion.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = ">=1.25,<3.0"
pandas = ">=2.1,<3.0"
matplotlib = ">=3.7,<4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
